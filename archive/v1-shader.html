<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procedural Wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, powerPreference: 'low-power' });

const vert = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

const frag = `
precision highp float;
uniform vec2 res;
uniform float t;

float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }

float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1,0)), f.x),
             mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
}

float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  mat2 r = mat2(0.8, -0.6, 0.6, 0.8);
  for(int i = 0; i < 6; i++){ v += a * noise(p); p = r * p * 2.02 + 7.3; a *= 0.5; }
  return v;
}

vec3 pal(float x){
  // deep indigo -> violet -> magenta -> teal -> warm gold
  vec3 a = vec3(0.03, 0.04, 0.12);
  vec3 b = vec3(0.30, 0.12, 0.62);
  vec3 c = vec3(0.90, 0.20, 0.55);
  vec3 d = vec3(0.10, 0.80, 0.80);
  vec3 e = vec3(1.00, 0.78, 0.40);
  x = clamp(x, 0.0, 1.0) * 4.0;
  if(x < 1.0) return mix(a, b, x);
  if(x < 2.0) return mix(b, c, x - 1.0);
  if(x < 3.0) return mix(c, d, x - 2.0);
  return mix(d, e, x - 3.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * res) / min(res.x, res.y);
  float time = t * 0.05;

  // domain-warped fbm (flowing smoke / aurora)
  vec2 q = vec2(fbm(uv * 1.6 + time), fbm(uv * 1.6 + vec2(5.2, 1.3) - time));
  vec2 r = vec2(fbm(uv * 1.6 + 3.0 * q + vec2(1.7, 9.2) + time * 1.5),
                fbm(uv * 1.6 + 3.0 * q + vec2(8.3, 2.8) - time * 1.2));
  float f = fbm(uv * 1.4 + 3.2 * r);

  float k = smoothstep(0.15, 0.95, f * 1.15 + length(q) * 0.35);
  vec3 col = pal(k);

  // glowing ridges where the field folds
  float ridge = 1.0 - abs(2.0 * fbm(uv * 2.2 + 2.5 * r + time * 2.0) - 1.0);
  col += pow(ridge, 6.0) * vec3(0.35, 0.55, 0.9) * 0.55;

  // twinkling stars
  vec2 g = gl_FragCoord.xy / 3.0;
  vec2 cell = floor(g);
  float s = hash(cell);
  float star = step(0.9975, s) * (0.5 + 0.5 * sin(t * (1.0 + s * 3.0) + s * 60.0));
  col += star * vec3(0.9, 0.95, 1.0) * (1.0 - k * 0.6);

  // vignette + gentle grain
  col *= 1.0 - 0.55 * dot(uv * 0.8, uv * 0.8);
  col += (hash(gl_FragCoord.xy + t) - 0.5) * 0.02;

  gl_FragColor = vec4(pow(col, vec3(0.95)), 1.0);
}`;

function sh(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vert));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'res');
const uT = gl.getUniformLocation(prog, 't');

// Render scale: lower = lighter on GPU (wallpapers should be cheap). 1 = native.
const SCALE = 0.75;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2) * SCALE;
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(uRes, canvas.width, canvas.height);
}
addEventListener('resize', resize); resize();

const start = performance.now();
function frame(now){
  gl.uniform1f(uT, (now - start) / 1000 + 40.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
